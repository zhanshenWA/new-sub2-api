name = "sub2api-frontend"
main = "src/worker.ts"
compatibility_date = "2026-07-15"
send_metrics = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
BACKEND_URL = "https://sub2api-router.zhanshenwa.workers.dev"

[[services]]
binding = "ROUTER"
service = "sub2api-router"
