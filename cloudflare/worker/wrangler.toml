#:schema node_modules/wrangler/config-schema.json
name = "sub2api-router"
main = "src/index.ts"
compatibility_date = "2026-07-15"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
EMAIL_TASK_BATCH_SIZE = "10"
CORS_ALLOWED_ORIGINS = "*"

[[d1_databases]]
binding = "DB"
database_name = "sub2api"
database_id = "831450c4-1dc1-4900-b0dc-38a7ddf2876c"
migrations_dir = "../d1/migrations"
